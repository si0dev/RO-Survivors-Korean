name: Extract game translation changes
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/extract-source.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public game resources and parse in memory
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { extractSnapshot, worklist, identify } from './src/core.mjs';
          import { sourceSnapshot, findPageBundle } from './src/browser.mjs';
          import { loadRecords } from './tools/records.mjs';
          const origin = 'https://ro-survivors.com';
          async function get(url) {
            const r = await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(20000)});
            if(!r.ok || new URL(r.url).origin !== origin) throw Error('HTTP '+r.status+' for '+new URL(url).pathname);
            return r.text();
          }
          const html = await get(origin+'/');
          const talents = await get(origin+'/talents.html');
          const queue = new Set();
          function add(raw,base) {
            try {
              const u=new URL(raw,base);
              if(u.origin===origin && (/\.m?js$/i.test(u.pathname)||/\/assets\/manifest\.json$/i.test(u.pathname))) queue.add(u.href);
            } catch {}
          }
          for(const m of (html+'\n'+talents).matchAll(/(?:src|href)\s*=\s*["']([^"']+)["']/gi)) add(m[1],origin+'/');
          add('/assets/manifest.json',origin);
          const files=[],errors=[];
          for(const url of queue) {
            if(files.length+errors.length>=100) throw Error('Resource limit reached');
            try {
              const content=await get(url);
              files.push({url,content,size:Buffer.byteLength(content)});
              if(/\.m?js$/i.test(new URL(url).pathname)) {
                for(const m of content.matchAll(/["']((?:\.\.?\/|\/build\/|\/assets\/)[^"'\s]{1,200}\.m?js(?:\?[^"'\s]*)?)["']/g)) add(m[1],url);
              }
            } catch(e) {errors.push({url,error:e.message});}
          }
          console.log('Resources fetched:',files.length,'errors:',errors.length);
          console.log('JS:',files.filter(f=>/\.m?js$/i.test(new URL(f.url).pathname)).length,'manifest:',files.filter(f=>/\/manifest\.json$/.test(new URL(f.url).pathname)).length);
          if(errors.length || !files.some(f=>/\/build\/main-[^/]+\.js$/.test(new URL(f.url).pathname)) || !files.some(f=>/\/build\/talents-[^/]+\.js$/.test(new URL(f.url).pathname)) || !files.some(f=>/\/manifest\.json$/.test(new URL(f.url).pathname))) throw Error('Incomplete resources');
          const snapshot=extractSnapshot(files);
          if(snapshot.newsScanFailed) throw Error('Latest news extraction failed');
          const records=await loadRecords();
          const rows=await worklist(snapshot,records.entries);
          console.log('SUMMARY '+JSON.stringify({build:snapshot.build,release:snapshot.newsRelease,errors,newsScanFailed:snapshot.newsScanFailed,total:rows.length,missing:rows.filter(r=>r.status==='missing').length,changed:rows.filter(r=>r.status==='changed').length}));
          // Verify composed equipment labels against current public resources, without retaining the source.
          const {buildScanDictionary}=await import('./src/browser.mjs');
          const {createGearNameTranslator}=await import('./src/language-adapter.mjs');
          const currentMain=findPageBundle(files.map(f=>f.url),origin+'/');
          const current=await sourceSnapshot({kind:'main',url:currentMain,build:snapshot.build,content:files.find(f=>f.url===currentMain).content},async url=>files.find(f=>f.url===url)?.content??await get(url));
          const identified=await Promise.all(current.rows.map(identify));
          const {nameDictionary}=buildScanDictionary(identified,[],records);
          const suffixes=[...new Set(files.flatMap(f=>/\.m?js$/.test(new URL(f.url).pathname)?[...f.content.matchAll(/\b(?:str|agi|vit|int|dex|luk)\s*:\s*\{\s*bonus\s*:\s*[\w$]+\s*,\s*suffix\s*:\s*"([^"]+)"/g)].map(m=>m[1]):[]))];
          if(!suffixes.length)throw Error('Stat affix source not found');
          const manifest=JSON.parse(files.find(f=>/\/assets\/manifest\.json$/.test(new URL(f.url).pathname)).content);
          const names=[...new Set(Object.values(manifest.items??{}).map(item=>item.name).filter(name=>typeof name==='string'))];
          const translateGear=createGearNameTranslator(nameDictionary);
          let checked=0,failed=0;
          for(const name of names)for(const suffix of suffixes){
            const item=nameDictionary[name],affix=nameDictionary[suffix];
            if(!item||!affix){failed++;continue;}
            for(const refine of ['', '+7 ']){
              checked++;
              const expected=refine+affix+' '+item;
              if(translateGear(refine+name+' '+suffix)!==expected)failed++;
            }
          }
          console.log('GEAR_VALIDATION '+JSON.stringify({items:names.length,affixes:suffixes.length,checked,failed}));
          if(failed)throw Error('Equipment composition verification failed');
          // Audit both runtime entry points, not only the first shared map in the combined extraction.
          const seen=new Set(rows.map(r=>r.id));
          const cached=new Map(files.map(f=>[f.url,f.content]));
          const read=async url=>cached.get(url)??await get(url);
          let complete=true;
          for(const [kind,page] of [['main',origin+'/'],['talents',origin+'/talents.html']]){
            try{
              const url=findPageBundle([...cached.keys()],page);
              if(!url)throw Error('Entry bundle missing');
              const scoped=await sourceSnapshot({kind,url,build:snapshot.build,content:cached.get(url)},read);
              for(const row of [...scoped.rows,...scoped.newsHistory])seen.add((await identify(row)).id);
              console.log('AUDIT_PAGE '+JSON.stringify({kind,rows:scoped.rows.length,build:scoped.build}));
            }catch(e){complete=false;console.log('AUDIT_PAGE '+JSON.stringify({kind,error:e.message}));}
          }
          // Keep historical news in the inventory regardless of page-specific rendering.
          for(const row of snapshot.newsHistory)seen.add((await identify(row)).id);
          const unmatched=Object.entries(records.entries).filter(([id,r])=>r.scope!=='wiki'&&!seen.has(id));
          console.log('AUDIT '+JSON.stringify({build:snapshot.build,scope:'game-talents-news',complete,unmatched:unmatched.length}));
          for(const [id,r] of unmatched)console.log('UNMATCHED '+JSON.stringify({id,sourceHash:r.sourceHash}));
          for(const row of rows.filter(r=>r.status!=='translated')) console.log('WORKROW '+JSON.stringify(row));
          NODE

  wiki-nine-static:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit nine exact source labels in live bundle
        run: |
          node --input-type=module <<'NODE'
          import {findPageBundle} from './src/browser.mjs';
          const origin='https://ro-survivors.com/';
          const get=async u=>{const r=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('HTTP '+r.status);return r.text()};
          const html=await get(origin);
          const url=findPageBundle([...html.matchAll(/(?:src|href)\s*=\s*["']([^"']+)["']/gi)].map(x=>x[1]),origin);
          const code=await get(url);
          const build=code.match(/RO Survivors[^*\n]*?Build\s+([0-9a-f]{7,64})\b/i)?.[1];
          console.log('LIVE_BUILD '+build);
          for(const label of ['Prontera Librarian','(Rare/Epic)','(Epic/Legendary)','(Legendary)',': Soldier Skeleton, Sohee','Dragon Breath','Snake Ring','Search','Búsqueda']){
            let pos=-1, hits=[];
            while((pos=code.indexOf(label,pos+1))>=0){hits.push(code.slice(Math.max(0,pos-130),pos+label.length+130));}
            console.log('LABEL_AUDIT '+JSON.stringify({label,count:hits.length,contexts:hits.slice(0,12)}));
          }
          const checks=[
            ['librarian',/librar|bibliotec/gi],
            ['quality-pair',/rare.{0,12}epic|epic.{0,12}legendary|raro.{0,12}épico|épico.{0,12}legendario/gi],
            ['soldier-sohee',/skel_soldier|soldier skeleton|sohee/gi],
            ['festival-gear',/Lantern Festival gear|equipo del Festival|data-pane-tab|wk-search/gi],
            ['items',/\b2527\b|\b2986\b/g]
          ];
          for(const [name,re] of checks){
            const hits=[...code.matchAll(re)];
            console.log('CONTEXT_AUDIT '+JSON.stringify({name,count:hits.length,contexts:hits.slice(0,15).map(h=>code.slice(Math.max(0,h.index-170),h.index+h[0].length+170))}));
          }
          const m=JSON.parse(await get(origin+'assets/manifest.json?v='+build));
          for(const label of ['Dragon Breath','Snake Ring']){
            const found=Object.entries(m.items??{}).filter(([id,v])=>v.name===label);
            console.log('ITEM_AUDIT '+JSON.stringify({label,found:found.map(([id,v])=>({id,name:v.name,keys:Object.keys(v)}))}));
          }
          NODE
