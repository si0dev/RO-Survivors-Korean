name: LLM dependency cache preparation (CPU only)
on:
  push:
    branches: [test/llm-dependency-cache]
permissions:
  contents: read
concurrency:
  group: ro-llm-dependency-cache-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: benchmark
      - uses: actions/checkout@v4
        with:
          ref: 1533e8cd8b4507fa4cfd5b709dc0f6a722ba7b81
          persist-credentials: false
          path: reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and install LLM CI dependencies
        uses: ./benchmark/.github/actions/llm-dependencies
        with:
          reference-dir: reference
      - name: Confirm dependency preparation
        run: echo "LLM_DEPENDENCY_PREPARATION_DONE"
  restore-test:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: benchmark
      - uses: actions/checkout@v4
        with:
          ref: 1533e8cd8b4507fa4cfd5b709dc0f6a722ba7b81
          persist-credentials: false
          path: reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and install LLM CI dependencies
        uses: ./benchmark/.github/actions/llm-dependencies
        with:
          reference-dir: reference
      - name: Confirm dependency restore
        run: echo "LLM_DEPENDENCY_RESTORE_TEST_DONE"
