name: LLM dependency cache preparation (CPU only)
on:
  pull_request:
    branches: [test/colab-adc-smoke]
    paths:
      - '.github/workflows/llm-dependency-cache.yml'
      - '.github/actions/llm-dependencies/**'
      - 'tools/colab-benchmark-*.py'
      - 'tools/colab-benchmark-*.sh'
      - 'tools/colab-cache-mount.py'
      - '.github/workflows/colab-smoke.yml'
      - 'tools/colab-benchmark-*.mjs'
      - 'tools/colab-benchmark-fixture.json'
      - 'tools/colab-requirements.txt'
permissions:
  contents: read
concurrency:
  group: ro-llm-dependency-cache-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'test/llm-dependency-cache' || github.event.pull_request.head.ref == 'test/llm-transport-recovery' || github.event.pull_request.head.ref == 'test/llm-checkpoint-resume' || github.event.pull_request.head.ref == 'test/llm-fixed-benchmark' || github.event.pull_request.head.ref == 'test/llm-kernel-transport' || github.event.pull_request.head.ref == 'test/llm-streaming-optimization') && github.event.pull_request.user.login == 'si0dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: benchmark
      - uses: actions/checkout@v4
        with:
          ref: 1533e8cd8b4507fa4cfd5b709dc0f6a722ba7b81
          persist-credentials: false
          path: reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and install LLM CI dependencies
        uses: ./benchmark/.github/actions/llm-dependencies
        with:
          reference-dir: reference
          browser: 'false'
      - name: Independent translation and evaluation Mock tests
        run: |
          python benchmark/tools/colab-benchmark-test.py -v
          python benchmark/tools/colab-benchmark-transport-test.py -v
          python benchmark/tools/colab-benchmark-checkpoint-test.py -v
          python benchmark/tools/colab-benchmark-kernel-test.py -v
          bash benchmark/tools/colab-benchmark-recover-test.sh
          bash -n benchmark/tools/colab-benchmark-workflow.sh
          python -m py_compile benchmark/tools/colab-cache-mount.py benchmark/tools/colab-benchmark-cache.py benchmark/tools/colab-benchmark-model.py benchmark/tools/colab-benchmark-bootstrap.py
      - name: Validate frozen sample and reject changed source/reference
        run: node benchmark/tools/colab-benchmark-fixture-check.mjs reference
      - name: Restore pinned rclone archive
        id: rclone
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ro-llm/rclone
          key: ro-rclone-v1.70.3-linux-amd64-v1
      - name: Verify pinned rclone archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ro-llm/rclone"
          cd "$HOME/.cache/ro-llm/rclone"
          if [ ! -s SHA256SUMS ] || [ ! -s rclone-v1.70.3-linux-amd64.zip ]; then
            curl -fsSL --retry 2 https://downloads.rclone.org/v1.70.3/SHA256SUMS -o SHA256SUMS
            curl -fsSL --retry 2 https://downloads.rclone.org/v1.70.3/rclone-v1.70.3-linux-amd64.zip -o rclone-v1.70.3-linux-amd64.zip
          fi
          grep -E '[[:space:]]\*?rclone-v1\.70\.3-linux-amd64\.zip
        run: echo "LLM_DEPENDENCY_PREPARATION_DONE"
  restore-test:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: benchmark
      - uses: actions/checkout@v4
        with:
          ref: 1533e8cd8b4507fa4cfd5b709dc0f6a722ba7b81
          persist-credentials: false
          path: reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and install LLM CI dependencies
        uses: ./benchmark/.github/actions/llm-dependencies
        with:
          reference-dir: reference
          browser: 'false'
      - name: Confirm dependency restore
        run: echo "LLM_DEPENDENCY_RESTORE_TEST_DONE"
 SHA256SUMS | sha256sum -c -
      - name: Save pinned rclone archive
        if: steps.rclone.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ro-llm/rclone
          key: ro-rclone-v1.70.3-linux-amd64-v1
      - name: Test pinned rclone direct copy without GPU
        run: python benchmark/tools/colab-benchmark-direct-cache-test.py
      - name: Test cleanup failure cannot be ignored
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          mkdir -p "$tmp"
          allocation_started=1
          timeout() { if [ "$1" = 180 ]; then return 9; fi; return 0; }
          if release_session; then exit 1; else rc=$?; fi
          [ "$rc" = 9 ] && [ "$allocation_started" = 1 ]
          echo "CLEANUP_FAILURE_TEST_PASS"
      - name: Confirm dependency preparation
        run: echo "LLM_DEPENDENCY_PREPARATION_DONE"
  restore-test:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: benchmark
      - uses: actions/checkout@v4
        with:
          ref: 1533e8cd8b4507fa4cfd5b709dc0f6a722ba7b81
          persist-credentials: false
          path: reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and install LLM CI dependencies
        uses: ./benchmark/.github/actions/llm-dependencies
        with:
          reference-dir: reference
          browser: 'false'
      - name: Confirm dependency restore
        run: echo "LLM_DEPENDENCY_RESTORE_TEST_DONE"
