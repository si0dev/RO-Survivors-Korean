name: Colab cached Index-Translate Q6_K benchmark (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/colab-smoke.yml'
      - 'tools/colab-benchmark-*'
permissions:
  contents: read
concurrency:
  group: ro-colab-drive-cache-benchmark
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/colab-adc-smoke' && github.event.pull_request.user.login == 'si0dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: benchmark
      - uses: actions/checkout@v4
        with:
          ref: 1533e8cd8b4507fa4cfd5b709dc0f6a722ba7b81
          persist-credentials: false
          path: reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and install LLM CI dependencies
        uses: ./benchmark/.github/actions/llm-dependencies
        with:
          reference-dir: reference
          browser: 'false'
      - name: Independent translation contract and evaluation tests
        run: |
          python benchmark/tools/colab-benchmark-test.py -v
          python benchmark/tools/colab-benchmark-transport-test.py -v
          python benchmark/tools/colab-benchmark-checkpoint-test.py -v
          python benchmark/tools/colab-benchmark-kernel-test.py -v
          bash benchmark/tools/colab-benchmark-recover-test.sh
      - name: Prepare fixed approved reference pairs offline
        shell: bash
        run: node benchmark/tools/colab-benchmark-prepare.mjs reference "$RUNNER_TEMP/ro-benchmark"
      - name: Restore pinned rclone archive
        id: rclone
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ro-llm/rclone
          key: ro-rclone-v1.70.3-linux-amd64-v1
      - name: Verify pinned rclone archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ro-llm/rclone"
          cd "$HOME/.cache/ro-llm/rclone"
          if [ ! -s SHA256SUMS ] || [ ! -s rclone-v1.70.3-linux-amd64.zip ]; then
            curl -fsSL --retry 2 https://downloads.rclone.org/v1.70.3/SHA256SUMS -o SHA256SUMS
            curl -fsSL --retry 2 https://downloads.rclone.org/v1.70.3/rclone-v1.70.3-linux-amd64.zip -o rclone-v1.70.3-linux-amd64.zip
          fi
          grep -E '[[:space:]]\*?rclone-v1\.70\.3-linux-amd64\.zip$' SHA256SUMS | sha256sum -c -
      - name: Save pinned rclone archive
        if: steps.rclone.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ro-llm/rclone
          key: ro-rclone-v1.70.3-linux-amd64-v1
      - name: Authenticate and verify zero active sessions
        shell: bash
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG_V2 }}
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          prepare_auth
      - name: Verify Drive cache and prepare rclone bootstrap
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          prepare_cache
      - name: Restore translation checkpoint
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          restore_checkpoint
      - name: GPU allocation, model preparation and streaming translation with recovery
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          run_benchmark
      - name: Assess completed translations
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          grep -qx BENCHMARK_DONE "$tmp/translation.log"
          python benchmark/tools/colab-benchmark-assess.py "$RUNNER_TEMP/ro-benchmark/references.json" "$tmp/translation.log"
      - name: Verify zero active sessions and remove private temporary files
        if: always()
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          final_cleanup
