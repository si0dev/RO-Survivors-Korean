name: Colab cached Index-Translate Q6_K benchmark (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/colab-smoke.yml'
permissions:
  contents: read
concurrency:
  group: ro-colab-drive-cache-benchmark
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/colab-adc-smoke' && github.event.pull_request.user.login == 'si0dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Colab CLI
        run: python -m pip install --disable-pip-version-check google-colab-cli==0.8.0
      - name: Release the single remaining Colab assignment and verify zero
        shell: bash
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          export XDG_CONFIG_HOME="$tmp/config"
          export GOOGLE_APPLICATION_CREDENTIALS="$tmp/adc.json"
          python - <<'PY'
          import os,json
          p=os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          data=json.loads(os.environ["COLAB_ADC_JSON"])
          assert data["type"]=="authorized_user"
          with open(p,"w") as f: json.dump(data,f)
          PY
          unset COLAB_ADC_JSON
          timeout 240 python - <<'PY'
          import time
          from colab_cli.auth import AuthProvider
          from colab_cli.common import state
          state.auth_provider=AuthProvider.ADC
          try:
              rows=state.client.list_assignments()
              print("COLAB_ACTIVE_BEFORE="+str(len(rows)),flush=True)
              if len(rows)>1:
                  raise SystemExit("CLEANUP_ABORTED_MULTIPLE_ASSIGNMENTS")
              if rows:
                  a=rows[0]
                  accelerator=getattr(a.accelerator,"name",str(a.accelerator))
                  if accelerator!="T4":
                      raise SystemExit("CLEANUP_ABORTED_NOT_T4")
                  state.client.unassign(a.endpoint)
                  print("COLAB_RELEASE_REQUEST_ACCEPTED",flush=True)
              for _ in range(12):
                  remaining=state.client.list_assignments()
                  if not remaining:
                      print("COLAB_ACTIVE_AFTER=0",flush=True)
                      print("COLAB_CLEANUP: PASS",flush=True)
                      break
                  time.sleep(5)
              else: raise SystemExit("CLEANUP_NOT_VERIFIED")
          except Exception as exc:
              print("COLAB_CLEANUP_ERROR="+type(exc).__name__,flush=True)
              raise SystemExit(1)
          PY
