name: Colab cached Index-Translate Q6_K benchmark (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/colab-smoke.yml'
permissions:
  contents: read
concurrency:
  group: ro-colab-drive-cache-benchmark
  cancel-in-progress: false
jobs:
  drive-auth-only:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/colab-adc-smoke' && github.event.pull_request.user.login == 'si0dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify OAuth and read-only access to existing model
        shell: bash
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG_V2 }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          export RO_CACHE_TMP="$tmp"
          python tools/colab-drive-auth.py
          python tools/colab-drive-existing-cache.py
  smoke:
    # Temporarily disabled until the independent OAuth/API test succeeds.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI and bounded-retry cache tools
        run: |
          python -m pip install --disable-pip-version-check google-colab-cli==0.8.0 requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: benchmark
      - name: Verify personal Drive OAuth and prepare cache before extraction
        shell: bash
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG_V2 }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          export RO_CACHE_TMP="$tmp"
          python benchmark/tools/colab-drive-auth.py
          unset RCLONE_CONFIG_SECRET
          python -m py_compile benchmark/tools/colab-cache-populate.py benchmark/tools/colab-cache-mount.py benchmark/tools/colab-benchmark-cache.py benchmark/tools/colab-benchmark-model.py
          python benchmark/tools/colab-cache-populate.py
      - uses: actions/checkout@v4
        with:
          ref: 1533e8cd8b4507fa4cfd5b709dc0f6a722ba7b81
          persist-credentials: false
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and select approved reference pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ro-benchmark"
          cd reference
          npm run build
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const path='tools/extract-wiki.mjs';
          const code=await readFile(path,'utf8');
          const marker=' const records=await loadRecords();';
          if(!code.includes(marker))throw Error('Extractor layout changed');
          await writeFile(path,code.replace(marker, " await (await import('node:fs/promises')).writeFile(process.env.RUNNER_TEMP+'/ro-benchmark/wiki.json',JSON.stringify({build:currentBuild,views:[...views]}));\n"+marker));
          NODE
          node tools/extract-wiki.mjs
          cd ..
          node benchmark/tools/colab-benchmark-prepare.mjs reference "$RUNNER_TEMP/ro-benchmark"
          rm "$RUNNER_TEMP/ro-benchmark/wiki.json"
      - name: Execute isolated translation benchmark
        shell: bash
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG_V2 }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          export XDG_CONFIG_HOME="$tmp/config"
          cli=(colab --auth=adc --config "$tmp/sessions.json")
          export RO_CACHE_TMP="$tmp"
          export REMOTE_CONFIG="/tmp/ro-model-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.conf"
          gpu="ro-translate-$GITHUB_RUN_ID"
          cleanup() {
            for session in "$gpu"; do
              timeout 60 "${cli[@]}" stop -s "$session" >"$tmp/stop.log" 2>&1 </dev/null || true
            done
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$tmp/adc.json"
          python - <<'PY'
          import os,json
          p=os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          try:
              data=json.loads(os.environ["COLAB_ADC_JSON"])
              assert data["type"] == "authorized_user"
              assert all(data.get(k) for k in ("client_id","client_secret","refresh_token"))
          except Exception:
              raise SystemExit("ADC secret missing or invalid authorized_user JSON")
          with open(p,"w") as f:
              json.dump(data,f)
          print("ADC secret format OK")
          PY
          unset COLAB_ADC_JSON
          # Never emit raw authentication or session logs into this public repository.
          check() {
            local phase="$1" limit="$2"
            shift 2
            if timeout "$limit" "$@" </dev/null >"$tmp/$phase.log" 2>&1; then
              echo "$phase: PASS"
            else
              local rc=$?
              echo "$phase: FAIL (exit $rc)"
              python - "$tmp/$phase.log" <<'PY'
          import re,sys
          s=open(sys.argv[1],errors="replace").read()
          for pattern in (r"\b401\b",r"\b403\b",r"\b429\b",r"\b503\b",r"invalid_grant",r"invalid_scope",r"accessNotConfigured",r"SERVICE_DISABLED",r"insufficientPermissions",r"rateLimitExceeded",r"userRateLimitExceeded",r"storageQuotaExceeded",r"appNotAuthorizedToFile",r"domainPolicy",r"insufficient.{0,20}scope",r"quota",r"resource exhausted",r"not available",r"authentication",r"timeout",r"no available",r"permission denied",r"allocation",r"ENGINE_ASSET_UNAVAILABLE",r"ENGINE_START_FAILED",r"ENGINE_READY_TIMEOUT",r"FULL_GPU_OFFLOAD_NOT_VERIFIED",r"TRANSLATION_TRUNCATED",r"GPU_MODEL_MEMORY_NOT_VERIFIED"):
              if re.search(pattern,s,re.I):
                  print("Diagnostic category:",pattern.replace("\\b",""))
          if sys.argv[1].endswith("/translation.log"):
              import json
              for line in s.splitlines():
                  if "INDEX_GPU_DIAGNOSTIC=" not in line: continue
                  try:
                      d,_=json.JSONDecoder().raw_decode(line.split("INDEX_GPU_DIAGNOSTIC=",1)[1])
                      keys=("offloads","server_gpu_mib","gpu_free_mib","gpu_total_mib","cuda_model_buffers_mib","cuda_log_seen")
                      print("GPU_DIAGNOSTIC "+json.dumps({k:d[k] for k in keys}))
                  except (ValueError,KeyError,TypeError): pass
          PY
              exit "$rc"
            fi
          }
          python benchmark/tools/colab-drive-auth.py
          unset RCLONE_CONFIG_SECRET
          check auth 90 "${cli[@]}" sessions
          check gpu-session 180 "${cli[@]}" new -s "$gpu" --gpu T4
          # Refresh on the runner immediately before passing a short-lived credential.
          python - <<'PY'
          import configparser,json,os,pathlib
          p=pathlib.Path(os.environ["RO_CACHE_TMP"])
          c=configparser.ConfigParser(interpolation=None);c.read(p/"drive.conf")
          t=json.loads(c["rocache"]["token"]);t["expiry"]="2000-01-01T00:00:00Z"
          c["rocache"]["token"]=json.dumps(t)
          with (p/"drive.conf").open("w") as f: c.write(f)
          PY
          check drive-refresh 120 rclone --config "$tmp/drive.conf" lsjson rocache:RO-Survivors-Korean-cache-v2/index-translate-9b-q6k-b12343-v1 --files-only
          python - <<'PY'
          import configparser,json,os,pathlib,datetime
          p=pathlib.Path(os.environ["RO_CACHE_TMP"])
          c=configparser.ConfigParser(interpolation=None);c.read(p/"drive.conf")
          t=json.loads(c["rocache"]["token"])
          expiry=datetime.datetime.fromisoformat(t["expiry"].replace("Z","+00:00"))
          assert (expiry-datetime.datetime.now(datetime.timezone.utc)).total_seconds()>1800
          short=configparser.ConfigParser(interpolation=None)
          short["rocache"]={"type":"drive","scope":"drive.file","client_id":c["rocache"]["client_id"],"token":json.dumps({k:t[k] for k in ("access_token","token_type","expiry")})}
          with (p/"short.conf").open("w") as f: short.write(f)
          PY
          check token-upload 60 "${cli[@]}" upload -s "$gpu" "$tmp/short.conf" "$REMOTE_CONFIG"
          rm -f "$tmp/short.conf" "$tmp/drive.conf"
          python - "$RUNNER_TEMP/ro-benchmark/inputs.json" "$tmp/benchmark.py" <<'PY'
          import json,sys,os,pathlib
          inputs=json.load(open(sys.argv[1]))
          assert len(inputs)==200 and all("reference" not in row for row in inputs)
          root=pathlib.Path("benchmark/tools")
          body="import json\nINPUTS=json.loads("+repr(json.dumps(inputs,ensure_ascii=False))+")\nCONFIG="+repr(os.environ["REMOTE_CONFIG"])+"\n"
          for name in ("colab-cache-mount.py","colab-benchmark-cache.py","colab-benchmark-model.py"): body+=(root/name).read_text()+"\n"
          compile(body,"benchmark.py","exec")
          pathlib.Path(sys.argv[2]).write_text(body)
          PY
          rc=0
          timeout 5100 "${cli[@]}" exec -s "$gpu" --timeout 4800 -f "$tmp/benchmark.py" >"$tmp/translation.log" 2>&1 </dev/null || rc=$?
          python - "$tmp/translation.log" <<'PY'
          import json,sys,re
          for path in sys.argv[1:]:
              for line in open(path,errors="replace"):
                  for marker,keys in (("CACHE_PREPARED=",("mode","bytes","seconds")),("CACHE_REUSED=",("mode","model_direct","model_bytes","engine_unpack_seconds")),("INDEX_GPU_DIAGNOSTIC=",("offloads","server_gpu_mib","gpu_free_mib","gpu_total_mib","cuda_model_buffers_mib","cuda_log_seen"))):
                      if marker not in line: continue
                      try:
                          d,_=json.JSONDecoder().raw_decode(line.split(marker,1)[1])
                          print(marker+json.dumps({k:d[k] for k in keys}))
                      except (ValueError,KeyError,TypeError): pass
                  m=re.search(r"MODEL_LOAD_SECONDS (\d+(?:\.\d+)?)",line)
                  if m: print("MODEL_LOAD_SECONDS "+m.group(1))
                  if line.strip() in ("INDEX_FULL_GPU_OFFLOAD_UNCONFIRMED","RCLONE_MODEL_MOUNT_OK","MODEL_READY"): print(line.strip())
                  if re.fullmatch(r"RCLONE_TEST_ERROR:[a-z_]+:[A-Za-z]+",line.strip()): print(line.strip())
                  m=re.search(r"INDEX_FULL_GPU_OFFLOAD (\d+/\d+)",line)
                  if m: print("INDEX_FULL_GPU_OFFLOAD "+m.group(1))
                  for category in ("CACHE_NOT_READY","CACHE_SIZE_MISMATCH","ENGINE_CACHE_HASH_MISMATCH","ENGINE_START_FAILED","ENGINE_READY_TIMEOUT","GPU_MODEL_MEMORY_NOT_VERIFIED","TRANSLATION_TRUNCATED"):
                      if category in line: print("Diagnostic category: "+category)
          PY
          check gpu-stop 90 "${cli[@]}" stop -s "$gpu"
          if [ "$rc" != 0 ]; then echo "translation: FAIL (exit $rc)"; exit "$rc"; fi
          grep -qx BENCHMARK_DONE "$tmp/translation.log" || { echo "Benchmark completion marker missing"; exit 1; }
          echo "translation: PASS"
          python benchmark/tools/colab-benchmark-assess.py "$RUNNER_TEMP/ro-benchmark/references.json" "$tmp/translation.log"
      - name: Remove temporary benchmark source data
        if: always()
        run: rm -rf "$RUNNER_TEMP/ro-benchmark"
