name: Colab cached Index-Translate Q6_K benchmark (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/colab-smoke.yml'
permissions:
  contents: read
concurrency:
  group: ro-colab-drive-cache-benchmark
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/colab-adc-smoke' && github.event.pull_request.user.login == 'si0dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official CLI
        run: python -m pip install --disable-pip-version-check google-colab-cli==0.8.0
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: benchmark
      - uses: actions/checkout@v4
        with:
          ref: 1533e8cd8b4507fa4cfd5b709dc0f6a722ba7b81
          persist-credentials: false
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and select approved reference pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ro-benchmark"
          cd reference
          npm run build
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const path='tools/extract-wiki.mjs';
          const code=await readFile(path,'utf8');
          const marker=' const records=await loadRecords();';
          if(!code.includes(marker))throw Error('Extractor layout changed');
          await writeFile(path,code.replace(marker, " await (await import('node:fs/promises')).writeFile(process.env.RUNNER_TEMP+'/ro-benchmark/wiki.json',JSON.stringify({build:currentBuild,views:[...views]}));\n"+marker));
          NODE
          node tools/extract-wiki.mjs
          cd ..
          node benchmark/tools/colab-benchmark-prepare.mjs reference "$RUNNER_TEMP/ro-benchmark"
          rm "$RUNNER_TEMP/ro-benchmark/wiki.json"
      - name: Execute isolated translation benchmark
        shell: bash
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          export XDG_CONFIG_HOME="$tmp/config"
          cli=(colab --auth=adc --config "$tmp/sessions.json")
          cpu="ro-cache-$GITHUB_RUN_ID"
          gpu="ro-translate-$GITHUB_RUN_ID"
          cleanup() {
            for session in "$cpu" "$gpu"; do
              timeout 60 "${cli[@]}" stop -s "$session" >"$tmp/stop.log" 2>&1 </dev/null || true
            done
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$tmp/adc.json"
          python - <<'PY'
          import os,json
          p=os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          try:
              data=json.loads(os.environ["COLAB_ADC_JSON"])
              assert data["type"] == "authorized_user"
              assert all(data.get(k) for k in ("client_id","client_secret","refresh_token"))
          except Exception:
              raise SystemExit("ADC secret missing or invalid authorized_user JSON")
          with open(p,"w") as f:
              json.dump(data,f)
          print("ADC secret format OK")
          PY
          unset COLAB_ADC_JSON
          # Never emit raw authentication or session logs into this public repository.
          check() {
            local phase="$1" limit="$2"
            shift 2
            if timeout "$limit" "$@" </dev/null >"$tmp/$phase.log" 2>&1; then
              echo "$phase: PASS"
            else
              local rc=$?
              echo "$phase: FAIL (exit $rc)"
              python - "$tmp/$phase.log" <<'PY'
          import re,sys
          s=open(sys.argv[1],errors="replace").read()
          for pattern in (r"\b401\b",r"\b403\b",r"\b429\b",r"\b503\b",r"invalid_grant",r"invalid_scope",r"insufficient.{0,20}scope",r"quota",r"resource exhausted",r"not available",r"authentication",r"timeout",r"no available",r"permission denied",r"allocation",r"ENGINE_ASSET_UNAVAILABLE",r"ENGINE_START_FAILED",r"ENGINE_READY_TIMEOUT",r"FULL_GPU_OFFLOAD_NOT_VERIFIED",r"TRANSLATION_TRUNCATED",r"GPU_MODEL_MEMORY_NOT_VERIFIED"):
              if re.search(pattern,s,re.I):
                  print("Diagnostic category:",pattern.replace("\\b",""))
          if sys.argv[1].endswith("/translation.log"):
              import json
              for line in s.splitlines():
                  if "INDEX_GPU_DIAGNOSTIC=" not in line: continue
                  try:
                      d,_=json.JSONDecoder().raw_decode(line.split("INDEX_GPU_DIAGNOSTIC=",1)[1])
                      keys=("offloads","server_gpu_mib","gpu_free_mib","gpu_total_mib","cuda_model_buffers_mib","cuda_log_seen")
                      print("GPU_DIAGNOSTIC "+json.dumps({k:d[k] for k in keys}))
                  except (ValueError,KeyError,TypeError): pass
          PY
              exit "$rc"
            fi
          }
          check auth 90 "${cli[@]}" sessions
          check cache-session 120 "${cli[@]}" new -s "$cpu"
          check cache-mount 120 "${cli[@]}" drivemount -s "$cpu" /content/drive
          python - "$tmp/cache.py" <<'PY'
          import sys,pathlib
          code=pathlib.Path("benchmark/tools/colab-benchmark-cache.py").read_text()
          code+="\npopulate()\n"
          # Execute as one compiled unit and emit a bounded diagnostic even if the remote kernel swallows exceptions.
          wrapper="import traceback,json\ntry:\n    exec(compile("+repr(code)+", 'ro_cache.py', 'exec'), globals())\n    from google.colab import drive as colab_drive\n    colab_drive.flush_and_unmount()\n    print('CACHE_FLUSHED_OK_271',flush=True)\nexcept BaseException as exc:\n    frames=traceback.extract_tb(exc.__traceback__)\n    print('CACHE_ERROR='+json.dumps({'type':type(exc).__name__,'line':frames[-1].lineno if frames else None,'code':getattr(exc,'errno',None)}),flush=True)\n    raise\n"
          compile(wrapper,"wrapper.py","exec")
          pathlib.Path(sys.argv[1]).write_text(wrapper)
          PY
          rc=0
          timeout 2400 "${cli[@]}" exec -s "$cpu" --timeout 1800 -f "$tmp/cache.py" >"$tmp/cache-prepare.log" 2>&1 </dev/null || rc=$?
          python - "$tmp/cache-prepare.log" <<'PY'
          import re,json,sys
          s=open(sys.argv[1],errors="replace").read()
          print("CACHE_LOG_BYTES "+str(len(s.encode())))
          for line in s.splitlines():
              for marker,keys in (("CACHE_ERROR=",("type","line","code")),("CACHE_PREPARED=",("mode","bytes","seconds"))):
                  if marker not in line: continue
                  try:
                      d,_=json.JSONDecoder().raw_decode(line.split(marker,1)[1])
                      print(marker+json.dumps({k:d[k] for k in keys}))
                  except (ValueError,KeyError,TypeError): pass
              if re.fullmatch(r"CACHE_FILE_SAVED (model|llama|cudart) \d+",line.strip()): print(line.strip())
          for name in ("SyntaxError","AssertionError","OSError","HTTPError","KeyError","ImportError","RuntimeError","Traceback","CACHE_SIZE_MISMATCH","DOWNLOAD_HASH_MISMATCH","DOWNLOAD_SIZE_MISMATCH","ENGINE_ASSET_UNAVAILABLE","DRIVE_NOT_MOUNTED","MY_DRIVE_NOT_FOUND","No space left","Quota exceeded"):
              if name in s: print("CACHE_DIAGNOSTIC "+name)
          PY
          if [ "$rc" != 0 ]; then echo "cache-prepare: FAIL (exit $rc)"; exit "$rc"; fi
          grep -qx 'CACHE_FLUSHED_OK_271' "$tmp/cache-prepare.log" || { echo "Cache flush not confirmed"; exit 1; }
          echo "cache-prepare: PASS"
          check cache-stop 90 "${cli[@]}" stop -s "$cpu"
          check gpu-session 180 "${cli[@]}" new -s "$gpu" --gpu T4
          check gpu-mount 120 "${cli[@]}" drivemount -s "$gpu" /content/drive
          python - "$RUNNER_TEMP/ro-benchmark/inputs.json" "$tmp/benchmark.py" <<'PY'
          import json,sys
          inputs=json.load(open(sys.argv[1]))
          assert len(inputs)==200 and all("reference" not in row for row in inputs)
          cache=open("benchmark/tools/colab-benchmark-cache.py").read()
          code=open("benchmark/tools/colab-benchmark-model.py").read()
          open(sys.argv[2],"w").write("import json\nINPUTS=json.loads("+repr(json.dumps(inputs,ensure_ascii=False))+")\n"+cache+"\n"+code)
          PY
          rc=0
          timeout 5100 "${cli[@]}" exec -s "$gpu" -f "$tmp/benchmark.py" >"$tmp/translation.log" 2>&1 </dev/null || rc=$?
          python - "$tmp/cache-prepare.log" "$tmp/translation.log" <<'PY'
          import json,sys,re
          for path in sys.argv[1:]:
              for line in open(path,errors="replace"):
                  for marker,keys in (("CACHE_PREPARED=",("mode","bytes","seconds")),("CACHE_REUSED=",("mode","model_direct","model_bytes","engine_unpack_seconds")),("INDEX_GPU_DIAGNOSTIC=",("offloads","server_gpu_mib","gpu_free_mib","gpu_total_mib","cuda_model_buffers_mib","cuda_log_seen"))):
                      if marker not in line: continue
                      try:
                          d,_=json.JSONDecoder().raw_decode(line.split(marker,1)[1])
                          print(marker+json.dumps({k:d[k] for k in keys}))
                      except (ValueError,KeyError,TypeError): pass
                  m=re.search(r"MODEL_LOAD_SECONDS (\d+(?:\.\d+)?)",line)
                  if m: print("MODEL_LOAD_SECONDS "+m.group(1))
                  if "INDEX_FULL_GPU_OFFLOAD_UNCONFIRMED" in line: print("INDEX_FULL_GPU_OFFLOAD_UNCONFIRMED")
                  m=re.search(r"INDEX_FULL_GPU_OFFLOAD (\d+/\d+)",line)
                  if m: print("INDEX_FULL_GPU_OFFLOAD "+m.group(1))
                  for category in ("CACHE_NOT_READY","CACHE_SIZE_MISMATCH","ENGINE_CACHE_HASH_MISMATCH","ENGINE_START_FAILED","ENGINE_READY_TIMEOUT","GPU_MODEL_MEMORY_NOT_VERIFIED","TRANSLATION_TRUNCATED"):
                      if category in line: print("Diagnostic category: "+category)
          PY
          check gpu-stop 90 "${cli[@]}" stop -s "$gpu"
          if [ "$rc" != 0 ]; then echo "translation: FAIL (exit $rc)"; exit "$rc"; fi
          grep -q BENCHMARK_DONE "$tmp/translation.log" || { echo "Benchmark completion marker missing"; exit 1; }
          echo "translation: PASS"
          python benchmark/tools/colab-benchmark-assess.py "$RUNNER_TEMP/ro-benchmark/references.json" "$tmp/translation.log"
      - name: Remove temporary benchmark source data
        if: always()
        run: rm -rf "$RUNNER_TEMP/ro-benchmark"
