name: Colab chained translation correction and verification (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/colab-smoke.yml'
      - 'tools/colab-benchmark-*'
      - 'tools/colab_cache_layout.py'
      - 'tools/colab-cache-populate.py'
      - 'tools/colab-cache-mount.py'
permissions:
  contents: read
concurrency:
  group: ro-colab-drive-cache-benchmark
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/colab-adc-smoke' && github.event.pull_request.user.login == 'si0dev'
    name: Cached Index draft → Hy-MT3 correction → Qwen3 verification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RO_BENCHMARK_MODE: semantic-review
      RO_REVIEW_COMPARISON: '1'
      RO_REVIEW_SCOPE: duration
      RO_CHAINED_REVIEW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: benchmark
      - uses: actions/checkout@v4
        with:
          ref: 1533e8cd8b4507fa4cfd5b709dc0f6a722ba7b81
          persist-credentials: false
          path: reference
      - uses: actions/checkout@v4
        with:
          ref: 97616b2423e1e04e13f33987a8aeac4ee4778f95
          persist-credentials: false
          path: historical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and install LLM CI dependencies
        uses: ./benchmark/.github/actions/llm-dependencies
        with:
          reference-dir: reference
          browser: 'false'
      - name: Independent semantic reviewer contract tests
        run: |
          python benchmark/tools/colab-benchmark-review-test.py -v
          python benchmark/tools/colab-benchmark-chain-test.py -v
      - name: Restore pinned rclone archive
        id: rclone
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ro-llm/rclone
          key: ro-rclone-v1.70.3-linux-amd64-v1
      - name: Verify pinned rclone archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ro-llm/rclone"
          cd "$HOME/.cache/ro-llm/rclone"
          if [ ! -s SHA256SUMS ] || [ ! -s rclone-v1.70.3-linux-amd64.zip ]; then
            curl -fsSL --retry 2 https://downloads.rclone.org/v1.70.3/SHA256SUMS -o SHA256SUMS
            curl -fsSL --retry 2 https://downloads.rclone.org/v1.70.3/rclone-v1.70.3-linux-amd64.zip -o rclone-v1.70.3-linux-amd64.zip
          fi
          grep -E '[[:space:]]\*?rclone-v1\.70\.3-linux-amd64\.zip$' SHA256SUMS | sha256sum -c -
      - name: Save pinned rclone archive
        if: steps.rclone.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ro-llm/rclone
          key: ro-rclone-v1.70.3-linux-amd64-v1
      - name: Authenticate and verify zero active sessions
        shell: bash
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG_V2 }}
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          prepare_auth
      - name: Initialize comparison profiles
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          comparison_profiles > "$tmp/profiles.tsv"
      - name: Restore actual Index-Translate drafts (read only, no inference)
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          node historical/tools/colab-benchmark-prepare.mjs reference "$RUNNER_TEMP/ro-benchmark"
          python benchmark/tools/colab-benchmark-chain.py restore "$tmp" "$RUNNER_TEMP/ro-benchmark" historical/tools
      - name: Drive cache - Hy-MT3-7B-Q8_0
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          prepare_comparison_model_cache 'Hy-MT3-7B-Q8_0'
      - name: Drive cache - Qwen3-14B-Q4_K_M
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          prepare_comparison_model_cache 'Qwen3-14B-Q4_K_M'
      - name: Allocate one Colab T4 session
        id: allocate
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          allocate_comparison_session
      - name: Hy-MT3 - correct existing Index-Translate drafts
        id: correct
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          run_chain_model 'Hy-MT3-7B-Q8_0' correct
      - name: Qwen3 - verify Hy-MT3 corrected drafts against English
        id: verify
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          run_chain_model 'Qwen3-14B-Q4_K_M' verify
      - name: Report chained translation results
        if: ${{ !cancelled() && steps.allocate.outcome == 'success' }}
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          python benchmark/tools/colab-benchmark-chain.py report "$tmp" "$RUNNER_TEMP/ro-benchmark"
      - name: Close Colab session, verify zero active sessions and clean up
        if: always()
        shell: bash
        run: |
          source benchmark/tools/colab-benchmark-workflow.sh
          final_cleanup
