name: Extract and verify wiki translation
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-wiki.yml'
      # Shared runtime modules can change how the wiki is rendered.
      - 'src/core.mjs'
      - 'src/language-adapter.mjs'
      - 'src/browser.mjs'
      - 'src/session.mjs'
      - 'tools/extract-wiki.mjs'
      - 'tools/build.mjs'
      - 'tools/records.mjs'
      - 'translations/wiki-fixed.json'
      - 'translations/wiki-variable.json'
      - 'translations/common.json'
concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  extract-wiki:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify current public game build
        id: build
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { findPageBundle } from './src/browser.mjs';
          const origin='https://ro-survivors.com/';
          const html=await fetch(origin,{cache:'no-store',signal:AbortSignal.timeout(20000)});
          if(!html.ok)throw Error('Game HTTP '+html.status);
          const urls=[...(await html.text()).matchAll(/(?:src|href)\s*=\s*["']([^"']+)["']/gi)].map(m=>m[1]);
          const url=findPageBundle(urls,origin);
          if(!url)throw Error('Main bundle missing');
          const res=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(20000)});
          if(!res.ok)throw Error('Bundle HTTP '+res.status);
          const build=(await res.text()).match(/RO Survivors[^*\n]*?Build\s+([0-9a-f]{7,64})\b/i)?.[1];
          if(!build)throw Error('Build missing');
          appendFileSync(process.env.GITHUB_OUTPUT,'id='+build+'\n');
          NODE
      - name: Restore successful verification marker
        id: verified
        uses: actions/cache@v4
        with:
          path: .wiki-verification
          # Daily checks also cover indirect changes in game translation labels.
          key: wiki-verified-${{ steps.build.outputs.id }}-${{ hashFiles('src/**', 'tools/**', 'translations/**', 'package.json', '.github/workflows/extract-wiki.yml') }}
      - if: github.event_name == 'workflow_dispatch' || steps.verified.outputs.cache-hit != 'true'
        run: npm run build
      - if: github.event_name == 'workflow_dispatch' || steps.verified.outputs.cache-hit != 'true'
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - if: github.event_name == 'workflow_dispatch' || steps.verified.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch' || steps.verified.outputs.cache-hit != 'true'
        run: node tools/extract-wiki.mjs --verify
      - if: github.event_name == 'workflow_dispatch' || steps.verified.outputs.cache-hit != 'true'
        run: mkdir -p .wiki-verification && touch .wiki-verification/success
