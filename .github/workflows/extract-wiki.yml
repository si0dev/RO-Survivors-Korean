name: Extract wiki translation changes
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/extract-wiki.yml'
      - 'tools/extract-wiki.mjs'
permissions:
  contents: read
jobs:
  extract-wiki:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/extract-wiki.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/extract-wiki.mjs
