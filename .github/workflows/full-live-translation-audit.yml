name: Full live translation quality audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-live-translation-audit.yml'
permissions:
  contents: read
concurrency:
  group: ro-colab-drive-cache-benchmark
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test audit contracts before allocating any GPU
        run: |
          python -m pip install requests
          python tools/llm/pipeline-test.py -v
          python -m compileall -q tools/llm
          bash -n tools/llm/workflow.sh
          node --test test/llm-update.test.mjs test/llm-live-audit.test.mjs
      - name: Extract every live game and wiki source including existing translations
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/live-audit-source"
          node tools/llm/extract-update.mjs "$RUNNER_TEMP/live-audit-source/game.json" --all
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/extract-wiki.mjs --output "$RUNNER_TEMP/live-audit-source/wiki.json" --all
      - name: Prepare encrypted full inventory and independent baseline
        id: prepare
        env:
          AUDIT_SEAL_SECRET: ${{ secrets.RCLONE_CONFIG_V2 }}
        run: |
          node tools/llm/live-audit.mjs prepare "$RUNNER_TEMP/live-audit-source" "$RUNNER_TEMP/live-audit-input"
      - uses: actions/upload-artifact@v4
        with:
          name: ro-live-audit-input
          path: ${{ runner.temp }}/live-audit-input/
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - if: always()
        run: rm -rf "$RUNNER_TEMP/live-audit-source" "$RUNNER_TEMP/live-audit-input"
  batch:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      RO_LIVE_AUDIT: '1'
      RO_SESSION_SUFFIX: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ro-live-audit-input
          path: ${{ runner.temp }}/live-audit-input
      - name: Unseal this batch only
        env:
          AUDIT_SEAL_SECRET: ${{ secrets.RCLONE_CONFIG_V2 }}
        run: |
          umask 077
          node tools/llm/live-audit.mjs unpack "$RUNNER_TEMP/live-audit-input" "$RO_SESSION_SUFFIX" "$RUNNER_TEMP/ro-update-llm"
          rm -rf "$RUNNER_TEMP/live-audit-input"
      - name: Install verified runtime dependencies
        run: |
          python -m pip install -r tools/llm/colab-requirements.txt
          python -m pip check
          if ! command -v rclone >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq rclone; fi
          mkdir -p "$HOME/.cache/ro-llm/rclone"
          cd "$HOME/.cache/ro-llm/rclone"
          curl -fsSL --retry 2 https://downloads.rclone.org/v1.70.3/SHA256SUMS -o SHA256SUMS
          curl -fsSL --retry 2 https://downloads.rclone.org/v1.70.3/rclone-v1.70.3-linux-amd64.zip -o rclone-v1.70.3-linux-amd64.zip
          grep -E '[[:space:]]\*?rclone-v1\.70\.3-linux-amd64\.zip$' SHA256SUMS | sha256sum -c -
      - name: Authenticate and prepare existing Drive caches
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG_V2 }}
        run: |
          source tools/llm/workflow.sh
          prepare_auth
          comparison_profiles > "$tmp/profiles.tsv"
          prepare_comparison_model_cache 'Index-Translate-9B-Q6_K'
          prepare_comparison_model_cache 'Hy-MT3-7B-Q8_0'
          prepare_comparison_model_cache 'Qwen3-14B-Q4_K_M'
      - name: Allocate one T4 and prefetch all three cached models
        run: |
          source tools/llm/workflow.sh
          allocate_comparison_session
          prefetch_models
      - name: Index-Translate - blind translation
        run: |
          source tools/llm/workflow.sh
          run_model 'Index-Translate-9B-Q6_K' index
      - name: Hy-MT3 - correct the actual Index drafts
        run: |
          source tools/llm/workflow.sh
          run_model 'Hy-MT3-7B-Q8_0' correct
      - name: Qwen3 - blind verification then separate approved-baseline comparison
        run: |
          source tools/llm/workflow.sh
          run_model 'Qwen3-14B-Q4_K_M' verify
      - name: Compare draft, correction and final candidate quality
        run: |
          python tools/llm/live-audit-report.py "$RUNNER_TEMP/ro-update-llm" "$RUNNER_TEMP/live-audit-result"
      - name: Release allocated Colab and erase temporary source and credentials
        if: always()
        run: |
          source tools/llm/workflow.sh
          cleanup
          rm -rf "$RUNNER_TEMP/live-audit-input"
      - uses: actions/upload-artifact@v4
        with:
          name: ro-live-audit-result-${{ matrix.batch }}
          path: ${{ runner.temp }}/live-audit-result/
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ro-update-llm" "$RUNNER_TEMP/live-audit-result" "$RUNNER_TEMP/live-audit-input"
  summarize:
    needs: [inventory,batch]
    if: always() && needs.inventory.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ro-live-audit-input
          path: ${{ runner.temp }}/live-audit-input
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ro-live-audit-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/live-audit-results
      - name: Aggregate all batches and report unprocessed rows explicitly
        run: node tools/llm/live-audit.mjs summarize "$RUNNER_TEMP/live-audit-input" "$RUNNER_TEMP/live-audit-results"
      - name: Remove transient audit artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[]|select(.name|startswith("ro-live-audit-"))|.id')
          for id in $ids; do gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
          rm -rf "$RUNNER_TEMP/live-audit-input" "$RUNNER_TEMP/live-audit-results"
          echo "LIVE_AUDIT_TRANSIENT_ARTIFACTS_REMOVED"
